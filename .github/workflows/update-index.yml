name: Update index.json

on:
  # When there is a change in the activities/ folder
  push:
    branches: [main]
    paths:
      - "activities/**/*.js"
      - ".github/scripts/generate-index.js"

  # Validate in PRs (check before merging)
  pull_request:
    branches: [main]
    paths:
      - "activities/**/*.js"

  # So that it can also be triggered manually
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Don't write index.json, just validate it)"
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Validate (works in PRs, also works on push)
  # ─────────────────────────────────────────────────────────────
  validate:
    name: Validate Activities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate activities (strict — blocks PR merge on any error)
        run: node .github/scripts/generate-index.js --dry-run --strict --verbose
        # --strict: even a single missing field fails the build → PR merge is blocked

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Generate & Commit (only works on main push)
  # ─────────────────────────────────────────────────────────────
  generate:
    name: Generate index.json
    runs-on: ubuntu-latest
    # Working in PRs, only on real pushes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Do not start before validating
    needs: validate

    permissions:
      contents: write # to be able to commit index.json.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A token is required for the bot to be able to commit
          token: ${{ secrets.GITHUB_TOKEN }}
          # Get all history (for diff)
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate index.json.gz + hash.json
        # No --strict: broken parsers are skipped, valid ones are always published.
        # Build only fails if ALL parsers are broken (entries = 0).
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node .github/scripts/generate-index.js --dry-run --verbose
          else
            node .github/scripts/generate-index.js --verbose
          fi

      - name: Check if output files changed
        id: diff
        run: |
          CHANGED_FILES=$(git diff --name-only index.json.gz hash.json activities/ 2>/dev/null || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No output files changed, skipping commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Changed files:"
            echo "$CHANGED_FILES"
            git diff --stat hash.json 2>/dev/null || true
            if git diff --quiet index.json.gz 2>/dev/null; then
              echo "   index.json.gz: unchanged"
            else
              echo "   index.json.gz: updated ($(wc -c < index.json.gz) bytes)"
            fi
          fi

      - name: Commit & Push generated files
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json.gz hash.json activities/
          git commit -m "chore: rebuild index and hash [skip ci]"
          git push

      - name: Upload generated files as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-files
          path: |
            index.json.gz
            hash.json
          retention-days: 7
